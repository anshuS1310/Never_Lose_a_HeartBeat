[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heartbeat-edge-pipeline"
version = "0.1.0"
description = "Offline-capable biosignal collection and cloud processing for ARM64 edge devices"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
pipeline = "heartbeat.cli:main"

[tool.setuptools.packages.find]
include = ["heartbeat*"]
